<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Data-Convo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        h2 {
            color: #343a40;
        }
        #payment-status {
            margin-top: 10px;
        }
        #submit-button {
            background-color: #007bff;
            border-color: #007bff;
        }
        #submit-button:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        #payment-element-container {
            display: none;
            margin-top: 20px;
        }
        #payment-element {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='temp_images/logo-no-background.png') }}" 
                     alt="Data-Convo Logo" 
                     style="height: 40px; width: auto;">
            </a>
            <!-- Rest of navbar -->
        </div>
    </nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Sign Up</h2>

                <!-- Flash Messages -->
                <div id="payment-status" class="alert" style="display: none;"></div>

                <!-- Signup Form -->
                <form id="signup-form" action="/signup" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Choose a secure password" required>
                    </div>
                    <div class="mb-3">
                        <label for="plan" class="form-label">Select Plan</label>
                        <select class="form-select" id="plan-select" name="plan" required>
                            <option value="free">Free</option>
                            <option value="pro">Pro (£25/month)</option>
                            <option value="enterprise">Enterprise (£99/month)</option>
                        </select>
                    </div>

                    <!-- Payment Element -->
                    <div id="payment-element-container">
                        <div id="payment-element"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="submit-button">Sign Up</button>
                </form>

                <!-- Payment Method Selection (Hidden by Default) -->
                <div id="payment-method-selection" class="mt-3" style="display: none;">
                    <h5 class="text-center mb-3">Choose Payment Method</h5>
                    <button id="pay-with-card" class="btn btn-primary w-100 mb-2">Pay with Card</button>
                    <button id="pay-with-paypal" class="btn btn-secondary w-100">Pay with PayPal</button>
                </div>

                <!-- PayPal Button Container -->
                <div id="paypal-button-container" class="mt-3" style="display: none;"></div>

                
            </div>
        </div>
    </div>

    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AUBX3yTJZIKNUmOyOqrzcTqwZA3BpYkyO7WerXB4HUYx_tGHorKkpBVkf9tuZcgGvQ8js2ZTJP_Idq6x&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
    const stripe = Stripe('{{ stripe_public_key }}');
    let paymentElement = null;
    const form = document.getElementById('signup-form');
    const planSelect = document.getElementById('plan-select');
    const paymentElementContainer = document.getElementById('payment-element-container');
    const paymentMethodSelection = document.getElementById('payment-method-selection');
    const paypalButtonContainer = document.getElementById('paypal-button-container');
    const submitButton = document.getElementById('submit-button');
    const paymentStatus = document.getElementById('payment-status');

    // Initialize Payment Element
    async function initializePayment(email, password, plan) {
        try {
            const response = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, plan }),
            });

            if (!response.ok) {
                throw new Error('Failed to create payment session.');
            }

            const data = await response.json();
            const elements = stripe.elements({ clientSecret: data.clientSecret });

            if (paymentElement) {
                paymentElement.unmount();
            }

            paymentElement = elements.create('payment');
            paymentElement.mount('#payment-element');
            paymentElementContainer.style.display = 'block';
        } catch (error) {
            console.error('Error initializing payment:', error);
            paymentElementContainer.style.display = 'none';
        }
    }

    // Handle plan selection
    planSelect.addEventListener('change', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const plan = planSelect.value;

        if (plan === 'pro' || plan === 'enterprise') {
            // Show payment method selection
            paymentMethodSelection.style.display = 'block';
            await initializePayment(email, password, plan);
        } else {
            // Hide payment method selection for free plan
            paymentMethodSelection.style.display = 'none';
            paypalButtonContainer.style.display = 'none';
            if (paymentElement) {
                paymentElement.unmount();
                paymentElement = null;
            }
            paymentElementContainer.style.display = 'none';
        }
    });

    // Handle Pay with Card
    document.getElementById('pay-with-card').addEventListener('click', async () => {
         // Retrieve the email, password, and plan from the form
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const plan = document.getElementById('plan-select').value;

        submitButton.disabled = true;
        submitButton.textContent = 'Processing...';

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, plan }),
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Signup failed.');
            }

            const data = await response.json();
            if (data.redirect_url) {
                window.location.href = data.redirect_url;  // Redirect to Stripe Checkout
            }
        } catch (error) {
            paymentStatus.textContent = error.message;  // Display the error message
            paymentStatus.className = 'alert alert-danger';
            paymentStatus.style.display = 'block';
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Sign Up';
        }
    });

    // Handle Pay with PayPal
    document.getElementById('pay-with-paypal').addEventListener('click', async () => {
        const email = document.getElementById('email').value; // Retrieve email
        const plan = planSelect.value;

        // Map the selected plan to the corresponding PayPal plan ID
        const paypalPlanIdMap = {
            'pro': 'P-2S363394HJ9019216M6KQA2Q', // Pro Plan ID
            'enterprise': 'P-6E7101731X1281440M6KQFZQ' // Enterprise Plan ID
        };

        const paypalPlanId = paypalPlanIdMap[plan];

        if (!paypalPlanId) {
            alert('Invalid plan selected. Please try again.');
            return;
        }

        // Hide the card payment element and show the PayPal button
        paymentElementContainer.style.display = 'none';
        paypalButtonContainer.style.display = 'block';

        // Render the PayPal button
        paypal.Buttons({
            style: {
                shape: 'rect',
                color: 'gold',
                layout: 'horizontal',
                label: 'subscribe'
            },
            createSubscription: function(data, actions) {
                return actions.subscription.create({
                    plan_id: paypalPlanId // Use the dynamically selected plan ID
                });
            },
            onApprove: function(data, actions) {
                alert(data.subscriptionID); // You can add optional success message for the subscriber here
                // Optionally, redirect the user to a success page or show a success message
                window.location.href = '/connection_form'; // Redirect to the connection form
            },
            onError: function(error) {
                console.error('PayPal Error:', error);
                alert('An error occurred with PayPal. Please try again.'); // Show error message to the user
            }
        }).render('#paypal-button-container');
    });

    // Handle form submission for free plan
    form.addEventListener('submit', async (event) => {
        event.preventDefault();  // Prevent traditional form submission
        const plan = planSelect.value;

        if (plan === 'free') {
            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, plan }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Signup failed.');
                }

                const data = await response.json();
                if (data.redirect_url) {
                    window.location.href = data.redirect_url;  // Redirect to the provided URL
                }
            } catch (error) {
                paymentStatus.textContent = error.message;  // Display the error message
                paymentStatus.className = 'alert alert-danger';
                paymentStatus.style.display = 'block';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Sign Up';
            }
        }
    });
});
    </script>
    
</body>
</html>
