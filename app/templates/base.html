<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Speak Data{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='temp_images/logo-no-background.png') }}" 
                         alt="Data-Convo Logo" 
                         style="height: 45px; width: auto;">
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#features">Features</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#how-it-works">How It Works</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#testimonials">Testimonials</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.signup') }}" class="btn btn-secondary">Sign Up</a>
                        </li>
                        <li class="nav-item ms-2">
                            <a href="{{ url_for('main.login') }}" class="btn btn-primary">Log In</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2024 Speak Data. All rights reserved.</p>
        <div class="social-icons mb-3">
            <!-- Instagram -->
            <a href="https://www.instagram.com/data_convo/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="text-white mx-2">
                <i class="fab fa-instagram fa-lg"></i>
            </a>
            
            <!-- X (Twitter) -->
            <a href="https://x.com/yourhandle" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="text-white mx-2">
                <i class="fab fa-x-twitter fa-lg"></i>
            </a>
            
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/company/data-convo/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="text-white mx-2">
                <i class="fab fa-linkedin-in fa-lg"></i>
            </a>
            
            <!-- Facebook -->
            <a href="https://www.facebook.com/yourpagename" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="text-white mx-2">
                <i class="fab fa-facebook-f fa-lg"></i>
            </a>
        </div>
    </footer>
    
    {% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% endblock %}
</body>
</html>
