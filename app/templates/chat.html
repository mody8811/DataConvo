<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Convo.beta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }

        #chat-container {
            display: flex;
            height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Freeze the sidebar */
        #sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh; /* Full height */
        }

        #sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #table-list {
            list-style: none;
            padding: 0;
        }

        #table-list li {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        #table-list li:hover {
            background-color: #34495e;
        }

        .columns-list {
            list-style: none;
            padding-left: 20px;
            margin-top: 10px;
            display: none;
        }

        .columns-list li {
            font-size: 14px;
            padding: 5px 0;
        }

        /* Chat area */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #f9f9f9;
            overflow: hidden; /* Prevent overflow */
        }

        #chat-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        #chat-display {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
            position: relative;
        }

        .message.User {
            background-color: #e1f5fe;
            align-self: flex-start;
            margin-right: 10px;
        }

        .message.AI {
            background-color: #f1f1f1;
            align-self: flex-start;
            margin-left: 10px;
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .status {
            color: #888;
            font-style: italic;
            text-align: center;
            margin: 10px 0;
            align-self: center;
        }

        #chat-input-container {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        #chat-input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #34495e;
        }

        #share-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .share-icon {
            display: none;
            cursor: pointer;
            font-size: 24px;
            margin-top: 10px;
            color: #2c3e50;
        }

        /* Table Styling */
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px; /* Ensure the table has a minimum width */
        }

        table th, table td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: left;
            white-space: nowrap; /* Prevent text wrapping */
        }

        table th {
            background-color: #f5f5f5;
            font-weight: 500;
        }

        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <!-- Sidebar for Database Tables -->
        <div id="sidebar">
            <h2>Database Tables</h2>
            <ul id="table-list">
                {% for table, columns in schema_info.items() %}
                    <li onclick="toggleColumns('{{ table }}')">{{ table }}
                        <ul id="columns-{{ table }}" class="columns-list">
                            {% for column in columns %}
                                <li>{{ column }}</li>
                            {% endfor %}
                        </ul>
                    </li>
                {% endfor %}
            </ul>
        </div>

        <!-- Chat Area -->
        <div id="chat-area">
            <h1 id="chat-title">Speak to Data.beta</h1>
            <div id="chat-display">
                <!-- Processing message will appear here -->
            </div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- Share Popup -->
    <div id="share-popup">
        <h2>Export Data</h2>
        <button onclick="window.location.href='/export_csv'">Export as CSV</button>
        <br><br>
        <button onclick="closeSharePopup()">Close</button>
    </div>
    <div class="popup-overlay" id="popup-overlay" onclick="closeSharePopup()"></div>

    <script>
        const chatDisplay = document.getElementById('chat-display');
        const chatInput = document.getElementById('chat-input');
        const shareIcon = document.createElement('div');
        shareIcon.className = 'share-icon';
        shareIcon.innerHTML = '🔗';
        shareIcon.id = 'share-icon';
        shareIcon.onclick = openSharePopup;
        chatDisplay.appendChild(shareIcon);

        chatInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const userMessage = chatInput.value;
            chatInput.value = '';
            appendMessage('User', userMessage);
            appendStatusMessage('Processing your request...');

            fetch('/get_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                clearStatusMessage();
                appendMessage('AI', data.response);
                if (data.response.includes('<table')) {
                    displayShareIcon(true);
                } else {
                    displayShareIcon(false);
                }
            });
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            
            // Check if the message contains a table
            if (message.includes('<table')) {
                const tableContainer = document.createElement('div');
                tableContainer.classList.add('table-container');
                tableContainer.innerHTML = message;
                messageElement.appendChild(tableContainer);
            } else {
                messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            }
            
            chatDisplay.appendChild(messageElement);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function appendStatusMessage(message) {
            const statusElement = document.createElement('div');
            statusElement.classList.add('status');
            statusElement.innerText = message;
            chatDisplay.prepend(statusElement); // Add to the top
        }

        function clearStatusMessage() {
            const statusElements = document.querySelectorAll('.status');
            statusElements.forEach(el => el.remove());
        }

        function toggleColumns(table) {
            const columnsList = document.getElementById(`columns-${table}`);
            columnsList.style.display = columnsList.style.display === 'none' ? 'block' : 'none';
        }

        function openSharePopup() {
            const popup = document.getElementById('share-popup');
            const overlay = document.getElementById('popup-overlay');
            popup.style.display = 'block';
            overlay.style.display = 'block';
        }

        function closeSharePopup() {
            const popup = document.getElementById('share-popup');
            const overlay = document.getElementById('popup-overlay');
            popup.style.display = 'none';
            overlay.style.display = 'none';
        }

        function displayShareIcon(display) {
            const shareIcon = document.getElementById('share-icon');
            if (display) {
                shareIcon.style.display = 'block';
            } else {
                shareIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
