<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Speak to Data.beta</title>
    <script>
        function toggleAuthFields() {
            const authType = document.getElementById('auth_type').value;
            const userPassFields = document.getElementById('user-pass-fields');
            if (authType === 'sql') {
                userPassFields.style.display = 'block';
            } else {
                userPassFields.style.display = 'none';
            }
        }

        function openSharePopup() {
            const popup = document.getElementById('share-popup');
            const overlay = document.getElementById('popup-overlay');
            popup.style.display = 'block';
            overlay.style.display = 'block';
        }

        function closeSharePopup() {
            const popup = document.getElementById('share-popup');
            const overlay = document.getElementById('popup-overlay');
            popup.style.display = 'none';
            overlay.style.display = 'none';
        }

        function displayShareIcon(display) {
            const shareIcon = document.getElementById('share-icon');
            if (display) {
                shareIcon.style.display = 'block';
            } else {
                shareIcon.style.display = 'none';
            }
        }
    </script>
    <style>
        #share-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
            padding: 20px;
            z-index: 1000;
        }
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .share-icon {
            display: none;
            cursor: pointer;
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="sidebar">
            <h2>Database Tables</h2>
            <ul id="table-list">
                {% for table, columns in schema_info.items() %}
                    <li onclick="toggleColumns('{{ table }}')">{{ table }}
                        <ul id="columns-{{ table }}" class="columns-list" style="display:none;">
                            {% for column in columns %}
                                <li>{{ column }}</li>
                            {% endfor %}
                        </ul>
                    </li>
                {% endfor %}
            </ul>
        </div>
        <div id="chat-area">
            <h1 id="chat-title">Speak to Data.beta</h1>
            <div id="chat-display"></div>
            <div style="display: flex;">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <div id="share-popup">
        <h2>Export Data</h2>
        <button onclick="window.location.href='/export_csv'">Export as CSV</button>
        <br><br>
        <button onclick="closeSharePopup()">Close</button>
    </div>
    <div class="popup-overlay" id="popup-overlay" onclick="closeSharePopup()"></div>

    <script>
        const chatDisplay = document.getElementById('chat-display');
        const chatInput = document.getElementById('chat-input');
        const shareIcon = document.createElement('div');
        shareIcon.className = 'share-icon';
        shareIcon.innerHTML = '🔗';
        shareIcon.id = 'share-icon';
        shareIcon.onclick = openSharePopup;
        chatDisplay.appendChild(shareIcon);

        chatInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const userMessage = chatInput.value;
            chatInput.value = '';
            appendMessage('User', userMessage);
            appendStatusMessage('Processing your request...');

            fetch('/get_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                clearStatusMessage();
                appendMessage('AI', data.response);
                if (data.response.includes('<table')) {
                    displayShareIcon(true);
                } else {
                    displayShareIcon(false);
                }
            });
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatDisplay.appendChild(messageElement);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function appendStatusMessage(message) {
            const statusElement = document.createElement('div');
            statusElement.classList.add('status');
            statusElement.innerText = message;
            chatDisplay.appendChild(statusElement);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function clearStatusMessage() {
            const statusElements = document.querySelectorAll('.status');
            statusElements.forEach(el => el.remove());
        }

        function toggleColumns(table) {
            const columnsList = document.getElementById(`columns-${table}`);
            columnsList.style.display = columnsList.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
