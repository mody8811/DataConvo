<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Setup — Data Convo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/static/brand/favicon.ico">
<link rel="stylesheet" href="/static/css/styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,.12) 0%,transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(139,92,246,.10) 0%,transparent 50%),var(--bg-primary);background-attachment:fixed;color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-card{max-width:480px;width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:36px 32px;animation:slideUp .5s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.setup-card h1{font-size:1.4rem;font-weight:800;margin:0 0 8px}
.setup-card .sub{color:var(--text-muted);font-size:.85rem;margin:0 0 24px}
.step{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-hover);margin-bottom:8px}
.qr-box{text-align:center;background:#fff;border-radius:12px;padding:16px;margin:0 0 20px;border:1px solid var(--border)}
.qr-box img{width:220px;height:220px;image-rendering:pixelated}
.secret-box{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.04em}
.code-form{margin-bottom:20px}
.code-form label{display:block;font-size:.85rem;color:var(--text-secondary);margin-bottom:8px}
.code-form input{width:100%;padding:12px 14px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:1.1rem;text-align:center;letter-spacing:.3em;font-family:'JetBrains Mono',monospace;outline:none}
.code-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.btn-primary{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff;border:none;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 14px var(--accent-glow)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.skip-link{display:block;text-align:center;margin-top:14px;color:var(--text-muted);font-size:.82rem;text-decoration:none}
.skip-link:hover{color:var(--text-primary)}
.feed-msg{font-size:.82rem;text-align:center;margin:10px 0;min-height:18px}
.feed-msg.error{color:var(--error)}
.feed-msg.success{color:var(--success)}
.mfa-note{color:var(--text-muted);font-size:.75rem;text-align:center}
</style>
</head>
<body>
<div class="setup-card">
  <div class="step">🔐 Security Setup</div>
  <h1>Protect your account</h1>
  <p class="sub">Set up Two-Factor Authentication for extra account security.</p>
  <div class="qr-box"><img id="qrImage" src="" alt="QR Code"></div>
  <div class="secret-box"><span id="secretKey">Loading...</span><button class="copy-btn" onclick="copySecret()">Copy</button></div>
  <form class="code-form" onsubmit="verifyCode(event)">
    <label for="mfaCode">Enter the 6-digit code from your authenticator app</label>
    <input type="text" id="mfaCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" autofocus>
    <div class="feed-msg" id="feedMsg"></div>
    <button type="submit" class="btn-primary" id="verifyBtn">Verify & Enable 2FA</button>
  </form>
  <a class="skip-link" href="/dashboard">Skip for now — I'll do this later</a>
  <p class="mfa-note">Recommended by ISO 27001 compliance guidelines.</p>
</div>
<script>
async function loadSetup(){try{const r=await fetch('/api/auth/mfa/setup',{credentials:'include'});const d=await r.json();document.getElementById('qrImage').src='data:image/png;base64,'+d.qr_b64;document.getElementById('secretKey').textContent=d.secret;}catch(e){showMsg('Failed to load MFA setup. Please refresh.','error');}}
function copySecret(){const k=document.getElementById('secretKey').textContent;if(navigator.clipboard){navigator.clipboard.writeText(k).then(()=>showMsg('Secret key copied!','success'));}else{showMsg('Secret key: '+k,'success');}}
function showMsg(t,type){const el=document.getElementById('feedMsg');el.textContent=t;el.className='feed-msg '+(type||'');}
async function verifyCode(e){e.preventDefault();const code=document.getElementById('mfaCode').value.trim();if(!/^\d{6}$/.test(code)){showMsg('Enter a valid 6-digit code.','error');return;}const btn=document.getElementById('verifyBtn');btn.disabled=true;btn.textContent='Verifying...';try{const r=await fetch('/api/auth/mfa/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({code})});const d=await r.json();if(d.success){showMsg('2FA enabled! Redirecting...','success');window.location.href='/dashboard';}else{showMsg(d.error||'Invalid code.','error');btn.disabled=false;btn.textContent='Verify & Enable 2FA';}}catch(err){showMsg('Network error: '+err.message,'error');btn.disabled=false;btn.textContent='Verify & Enable 2FA';}}
loadSetup();
</script>
</body>
</html>
