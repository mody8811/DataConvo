<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} — Data Convo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body{background:#030305;color:#e2e8f0;font-family:Inter,sans-serif;min-height:100vh;line-height:1.7;}
    .post-nav{position:sticky;top:0;z-index:100;background:rgba(3,3,5,.75);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
    .post-nav a{color:#94a3b8;text-decoration:none;font-weight:600;font-size:.9rem;}
    .post-nav a:hover{color:#fff;}
    .post-wrap{max-width:820px;margin:0 auto;padding:48px 24px 80px;}
    .post-wrap h1{font-size:2.2rem;line-height:1.2;margin:0 0 8px;}
    .post-meta{color:#64748b;font-size:.85rem;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #1e293b;}
    .post-body{color:#cbd5e1;font-size:1rem;}
    .post-body h2{color:#fff;font-size:1.4rem;margin:32px 0 12px;}
    .post-body h3{color:#fff;font-size:1.15rem;margin:24px 0 8px;}
    .post-body p{margin:14px 0;}
    .post-body a{color:#818cf8;text-decoration:underline;}
    .post-body code{background:#111827;border:1px solid #1e293b;border-radius:5px;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:.85em;}
    .post-body pre{background:#0b0f19;border:1px solid #1e293b;border-radius:10px;padding:16px;overflow-x:auto;margin:16px 0;}
    .post-body pre code{background:transparent;border:none;padding:0;}
    .post-body blockquote{border-left:3px solid #6366f1;margin:16px 0;padding:4px 16px;color:#94a3b8;}
    .post-body ul,.post-body ol{padding-left:24px;margin:12px 0;}
    .post-body li{margin:4px 0;}
    .post-body img{max-width:100%;border-radius:10px;border:1px solid #1e293b;}
    .post-body table{border-collapse:collapse;width:100%;margin:16px 0;}
    .post-body th,.post-body td{border:1px solid #1e293b;padding:8px 12px;text-align:left;}
    .post-body th{background:#111827;}
  </style>
</head>
<body>
  <nav class="post-nav">
    <a href="/" style="font-size:1.05rem;color:#fff;">← Data Convo</a>
    <a href="/blog">Blog</a>
  </nav>
  <div class="post-wrap">
    <h1>{{ post.title }}</h1>
    <div class="post-meta">By {{ post.author_name }} · {{ post.created_at.strftime('%b %d, %Y') if post.created_at else '' }}</div>
    <div class="post-body" id="post-body">{{ post.markdown }}</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const body = document.getElementById('post-body');
    if (body) body.innerHTML = marked.parse(body.textContent);
  </script>
</body>
</html>
